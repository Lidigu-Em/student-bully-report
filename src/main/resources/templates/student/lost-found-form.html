<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title th:text="${item.type == 'LOST' ? 'Report Lost Item' : 'Report Found Item'}"></title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .container {
            padding: 20px;
            max-width: 600px;
            margin: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }

        textarea,
        input[type="text"],
        select {
            width: 100%;
            padding: 10px;
            box-sizing: border-box;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .header-lost {
            color: #f44336;
        }

        .header-found {
            color: #2196F3;
        }
    </style>
</head>

<body>
    <nav>
        <i class="fa fa-mortar-board"></i>
        <h1>STUDENT MANAGEMENT SYSTEM</h1>
    </nav>

    <div class="container">
        <h3 th:text="${item.type == 'LOST' ? 'Report Lost Item' : 'Report Found Item'}"
            th:class="${item.type == 'LOST' ? 'header-lost' : 'header-found'}"></h3>
        <hr>
        <form th:action="@{/lostfound/save}" th:object="${item}" method="POST">
            <input type="hidden" th:field="*{type}">

            <div class="form-group">
                <label>Item Name:</label>
                <input type="text" th:field="*{itemName}" required placeholder="e.g. Blue Backpack, iPhone 13">
            </div>

            <div class="form-group">
                <label>Category:</label>
                <select th:field="*{category}">
                    <option value="Electronics">Electronics</option>
                    <option value="Bags/Books">Bags/Books</option>
                    <option value="Clothing">Clothing</option>
                    <option value="Stationery">Stationery</option>
                    <option value="Personal Items">Personal Items (Wallet, Keys, etc.)</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label>Description:</label>
                <textarea th:field="*{description}" rows="4" required
                    placeholder="Provide details (color, brand, distinguishing marks)..."></textarea>
            </div>

            <div class="form-group">
                <label th:text="${item.type == 'LOST' ? 'Location Lost:' : 'Location Found:'}"></label>
                <input type="text" th:field="*{location}" required placeholder="e.g. Room 302, Library, Cafeteria">
            </div>

            <div class="form-group">
                <button type="submit" class="btn"
                    th:text="${item.type == 'LOST' ? 'Submit Lost Report' : 'Submit Found Report'}"></button>
                <a th:href="@{/lostfound/my}" class="btn" style="background-color: #333;">Cancel</a>
            </div>
        </form>
    </div>
</body>

</html>
