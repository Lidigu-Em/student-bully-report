<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>My Lost & Found Reports</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .container {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .type-lost {
            color: #f44336;
            font-weight: bold;
        }

        .type-found {
            color: #2196F3;
            font-weight: bold;
        }

        .btn {
            background-color: #4CAF50;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
        }

        .btn-rev {
            background-color: #f44336;
            color: white;
            padding: 5px 10px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            text-decoration: none;
            display: inline-block;
            font-size: 12px;
        }

        .status-PENDING {
            color: orange;
        }

        .status-MATCHED {
            color: blue;
        }

        .status-CLAIMED {
            color: green;
        }
    </style>
</head>

<body>
    <nav>
        <i class="fa fa-mortar-board"></i>
        <h1>STUDENT MANAGEMENT SYSTEM</h1>
    </nav>

    <div class="container">
        <h3>My Lost & Found Reports</h3>
        <hr>
        <div style="display: flex; gap: 10px;">
            <a th:href="@{/lostfound/create(type='LOST')}" class="btn" style="background-color: #f44336;">Report Lost
                Item</a>
            <a th:href="@{/lostfound/create(type='FOUND')}" class="btn" style="background-color: #2196F3;">Report Found
                Item</a>
            <a th:href="@{/student/{id}/courses(id=${user.id})}" class="btn" style="background-color: #333;">Back to
                Dashboard</a>
        </div>

        <table>
            <thead>
                <tr>
                    <th>Type</th>
                    <th>Item Name</th>
                    <th>Category</th>
                    <th>Location</th>
                    <th>Date Reported</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${items}">
                    <td th:text="${item.type}" th:class="${item.type == 'LOST' ? 'type-lost' : 'type-found'}"></td>
                    <td th:text="${item.itemName}"></td>
                    <td th:text="${item.category}"></td>
                    <td th:text="${item.location}"></td>
                    <td th:text="${item.dateReported}"></td>
                    <td th:text="${item.status}" th:class="'status-' + ${item.status}"></td>
                    <td>
                        <form th:if="${item.status == 'PENDING'}" th:action="@{/lostfound/delete/{id}(id=${item.id})}"
                            method="POST">
                            <button type="submit" class="btn-rev"
                                onclick="if (!(confirm('Are you sure you want to delete this report?'))) return false">Delete</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
