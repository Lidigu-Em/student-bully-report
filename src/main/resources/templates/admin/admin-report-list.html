<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Bullying Reports Management</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-panel.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .container {
            padding: 20px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 20px;
        }

        th,
        td {
            border: 1px solid #ddd;
            padding: 12px;
            text-align: left;
        }

        th {
            background-color: #f2f2f2;
        }

        .status-badge {
            padding: 5px 10px;
            border-radius: 12px;
            font-size: 0.85em;
            font-weight: bold;
        }

        .status-PENDING {
            background-color: #fff3cd;
            color: #856404;
        }

        .status-UNDER_REVIEW {
            background-color: #cce5ff;
            color: #004085;
        }

        .status-RESOLVED {
            background-color: #d4edda;
            color: #155724;
        }

        .status-TEACHER_ACTION_PENDING {
            background-color: #ffeeba;
            color: #856404;
            border: 1px dashed #d39e00;
        }

        .btn-view {
            background-color: #007bff;
            color: white;
            padding: 5px 10px;
            text-decoration: none;
            border-radius: 4px;
        }

        .btn-export {
            display: inline-block;
            padding: 8px 14px;
            color: white;
            text-decoration: none;
            border-radius: 4px;
            font-size: 0.9em;
            margin-right: 8px;
        }
    </style>
</head>

<body>
    <nav>
        <i class="fa fa-mortar-board"></i>
        <h1>STUDENT MANAGEMENT SYSTEM</h1>
    </nav>

    <div class="vertical-navbar">
        <ul>
            <li><a th:href="${session.user != null ? '/teacher/' + session.user.id + '/courses' : '/admin/adminPanel'}">
                <i class="fa fa-home"></i><span>Dashboard</span></a></li>
            <li><a th:href="@{/reports/all}"><i class="fa fa-bullhorn"></i><span>Bullying Reports</span></a></li>
            <li><a th:href="@{/lostfound/all}"><i class="fa fa-search"></i><span>Lost &amp; Found Items</span></a></li>
        </ul>
    </div>

    <div class="content">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <h3>Bullying Reports Management</h3>
            <div>
                <a th:href="@{/reports/export/excel}" class="btn-export" style="background-color: #28a745;">
                    <i class="fa fa-file-excel-o"></i> Download Excel
                </a>
                <a th:href="@{/reports/export/pdf}" class="btn-export" style="background-color: #dc3545;">
                    <i class="fa fa-file-pdf-o"></i> Download PDF
                </a>
            </div>
        </div>
        <hr>
        <table>
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Reported By</th>
                    <th>Date Reported</th>
                    <th>Status</th>
                    <th>Teacher Proposed Action</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="report : ${reports}">
                    <td th:text="${report.id}"></td>
                    <td th:text="${report.anonymous ? 'Anonymous' : (report.reportedBy != null ? report.reportedBy.userName : 'Unknown')}"></td>
                    <td th:text="${report.createdAt}"></td>
                    <td>
                        <span th:class="'status-badge status-' + ${report.status}" th:text="${report.status}"></span>
                    </td>
                    <td>
                        <span th:if="${report.proposedStatus != null}">
                            <strong th:text="${report.proposedStatus}"></strong>
                            <span style="font-size: 0.85em; color: #666;" th:if="${report.proposedBy != null}"
                                  th:text="'(by ' + ${report.proposedBy.userName} + ')'"></span>
                        </span>
                        <span th:if="${report.proposedStatus == null}" style="color: #999;">-</span>
                    </td>
                    <td>
                        <a th:href="@{/reports/view/{id}(id=${report.id})}" class="btn-view">Details</a>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</body>

</html>
