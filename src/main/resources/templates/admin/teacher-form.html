<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">

<head>
    <title>Add Teacher</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="stylesheet" th:href="@{/css/navbar.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin-panel.css}">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css">
    <style>
        .form-container {
            max-width: 500px;
            margin: 30px auto;
            background: #f9f9f9;
            padding: 30px;
            border-radius: 8px;
            border: 1px solid #ddd;
        }
        .form-group {
            margin-bottom: 16px;
        }
        .form-group label {
            display: block;
            font-weight: bold;
            margin-bottom: 5px;
        }
        .form-group input {
            width: 100%;
            padding: 8px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .error { color: red; font-size: 0.9em; }
        .btn-submit {
            background-color: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .btn-submit:hover { background-color: #0056b3; }
    </style>
</head>

<body>
    <nav>
        <i class="fa fa-mortar-board"></i>
        <h1>STUDENT MANAGEMENT SYSTEM</h1>
        <ul>
            <li>
                <a><i class="fa fa-user-circle"></i>Admin</a>
                <ul class="dropdown">
                    <li>
                        <form action="#" th:action="@{/logout}" method="POST">
                            <input type="submit" value="Logout">
                        </form>
                    </li>
                </ul>
            </li>
        </ul>
    </nav>

    <div class="vertical-navbar">
        <ul>
            <li><a th:href="@{/admin/adminPanel}"><i class="fa fa-home fa-navbar"></i><span>Dashboard</span></a></li>
            <li><a th:href="@{/admin/courses}"><i class="fa fa-pencil fa-navbar"></i><span>Courses</span></a></li>
            <li><a th:href="@{/admin/students}"><i class="fa fa-user fa-navbar"></i><span>Students</span></a></li>
            <li><a th:href="@{/admin/teachers}"><i class="fa fa-user-secret fa-navbar"></i><span>Teachers</span></a></li>
            <li><a th:href="@{/reports/all}"><i class="fa fa-bullhorn fa-navbar"></i><span>Bullying Reports</span></a></li>
        </ul>
    </div>

    <div class="content">
        <h3><i class="fa fa-user-plus"></i> Add New Teacher</h3>
        <hr>

        <div class="form-container">
            <div th:if="${registrationError}" style="color:red; margin-bottom:15px;" th:text="${registrationError}"></div>

            <form th:action="@{/admin/saveTeacher}" th:object="${userDto}" method="POST">

                <div class="form-group">
                    <label>Username</label>
                    <input type="text" th:field="*{userName}" placeholder="Enter username">
                    <p th:if="${#fields.hasErrors('userName')}" class="error">Username is required!</p>
                </div>

                <div class="form-group">
                    <label>Password</label>
                    <input type="password" th:field="*{password}" placeholder="Enter password">
                    <p th:if="${#fields.hasErrors('password')}" class="error">Password is required!</p>
                </div>

                <div class="form-group">
                    <label>First Name</label>
                    <input type="text" th:field="*{firstName}" placeholder="Enter first name">
                    <p th:if="${#fields.hasErrors('firstName')}" class="error">First name is required!</p>
                </div>

                <div class="form-group">
                    <label>Last Name</label>
                    <input type="text" th:field="*{lastName}" placeholder="Enter last name">
                    <p th:if="${#fields.hasErrors('lastName')}" class="error">Last name is required!</p>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="text" th:field="*{email}" placeholder="Enter email">
                    <p th:if="${#fields.hasErrors('email')}" class="error">Email is required!</p>
                </div>

                <button type="submit" class="btn-submit"><i class="fa fa-save"></i> Create Teacher</button>
                <a th:href="@{/admin/teachers}" style="margin-left:15px;">Cancel</a>
            </form>
        </div>
    </div>
</body>

</html>
